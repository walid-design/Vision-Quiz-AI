openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quiz
    description: Quiz question analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyze-question:
    post:
      operationId: analyzeQuestion
      tags: [quiz]
      summary: Analyze a multiple-choice question image using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeQuestionRequest"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AnalyzeQuestionRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image of the question (PNG or JPEG)
        subject:
          type: string
          description: Certification or subject context (e.g. "AWS Solutions Architect")
        sessionId:
          type: string
          description: Optional session identifier
        confidenceThreshold:
          type: number
          minimum: 0.5
          maximum: 0.99
          description: Trigger an independent verification pass below this confidence
      required:
        - imageBase64
        - subject

    QuizAnalysisResult:
      type: object
      properties:
        questionDetected:
          type: boolean
          description: Whether a complete multiple-choice question and its choices were visible
        captureGuidance:
          type: string
          description: Short camera guidance when a complete question was not detected
        question:
          type: string
          description: Detected question text
        options:
          type: object
          additionalProperties:
            type: string
          description: Map of option letter to option text (e.g. A, B, C, D)
        answer:
          type: string
          description: Best answer letter (e.g. "B")
        answerText:
          type: string
          description: Full text of the selected answer
        confidence:
          type: number
          description: Confidence score 0-1
        explanation:
          type: string
          description: Brief explanation of the answer
        needsVerification:
          type: boolean
          description: Whether a second verification pass was triggered
        verified:
          type: boolean
          description: Whether first and second analysis agreed
        verifierAnswer:
          type: string
          description: Answer from the verification pass (if used)
        firstPassAnswer:
          type: string
          description: Answer from the first analysis pass (if verification was used)
        processingTimeMs:
          type: number
          description: Total processing time in milliseconds
      required:
        - questionDetected
        - captureGuidance
        - question
        - options
        - answer
        - answerText
        - confidence
        - explanation
        - needsVerification
        - processingTimeMs

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
